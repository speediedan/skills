# Formatting is pinned deliberately: consuming repos vendor these skills verbatim, and at least one
# runs mdformat over its own copy. If the stored form here is not that formatter's output, the
# consumer's hook rewrites the file on contact and re-creates drift on every commit, permanently.
# Bumping `rev` or changing the plugin list may reformat the skills. After any such bump: re-run the
# hooks here, then re-push to consumers and confirm their hooks leave the files unmodified.
repos:
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat_frontmatter

  - repo: local
    hooks:
      # One gate for structure + Agent Skills spec + neutrality (scripts/check_skills.sh).
      # Runs on every commit rather than only when the manifest changes: the manifest can be left
      # untouched and still be wrong, which is the whole failure mode (a directory renamed, a
      # frontmatter delimiter lost). always_run with pass_filenames false because the check walks the
      # tree itself and validates relationships between files, not files in isolation.
      - id: skills-gate
        name: skills resolve, validate, and stay neutral
        entry: scripts/check_skills.sh
        language: script
        always_run: true
        pass_filenames: false

      # Runs on every commit rather than only when the manifest changes: the manifest can be left
      # untouched and still be wrong, which is the whole failure mode (a directory renamed, a
      # frontmatter delimiter lost). always_run with pass_filenames false because the check walks the
      # tree itself and validates relationships between files, not files in isolation.
      # Enforces mechanically what was previously a note in another repo's script header, which is
      # to say not enforced: a section was added to a skill without re-running the normalizer, the
      # master was published unnormalized, and a consumer found it when their own hook rewrote the
      # file. The requirement had been recorded, verified once, and then depended on for weeks.
      - id: skills-normalized
        name: skills are a fixed point of the pinned formatter
        entry: scripts/check_normalized.sh
        language: script
        files: 'SKILL\.md$'
